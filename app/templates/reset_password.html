<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ✅ THIS IS WHAT WAS MISSING — CSRF token must be here -->
    <meta name="csrf-token" content="{{ csrf_token }}">

    <title>Reset Password — Eco-Fertilization</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body, html {
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a2a1a 50%, #0a0a0a 100%);
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }
        .glass-container {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(185,255,0,0.25);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 45px 40px;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
        }
        .form-title { text-align:center; font-size:1.8rem; font-weight:700; color:#b9ff00; margin-bottom:8px; letter-spacing:1px; }
        .subtitle { text-align:center; font-size:0.95rem; opacity:0.7; margin-bottom:30px; }
        .field-group { margin-bottom:20px; }
        .field-group label { display:block; font-size:0.9rem; margin-bottom:8px; color:rgba(255,255,255,0.85); font-weight:500; }
        .field-group input { width:100%; padding:14px; font-size:1rem; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.08); color:#fff; box-sizing:border-box; outline:none; transition:border 0.2s; }
        .field-group input:focus { border-color:#b9ff00; }
        .submit-btn { width:100%; padding:15px; font-size:1.05rem; font-weight:700; letter-spacing:1px; background:linear-gradient(135deg,#b9ff00,#7acc00); color:#000; border:none; border-radius:10px; cursor:pointer; margin-top:10px; transition:0.3s; }
        .submit-btn:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(185,255,0,0.4); }
        .submit-btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
        .msg-error { color:#ff6b6b; font-size:0.95rem; margin-top:12px; text-align:center; display:none; }
        .msg-success { color:#b9ff00; font-size:0.95rem; margin-top:12px; text-align:center; display:none; }
        .back-link { display:block; text-align:center; margin-top:25px; color:#b9ff00; text-decoration:none; font-size:0.95rem; cursor:pointer; }
        .back-link:hover { text-decoration:underline; }
        .step { display:none; }
        .step.active { display:block; }
        .otp-input { font-size:2rem !important; text-align:center; letter-spacing:10px; font-weight:700; }
        .password-wrapper { position:relative; }
        .password-wrapper input { padding-right:45px; }
        .toggle-eye { position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:1.2rem; user-select:none; }
        .step-indicator { display:flex; justify-content:center; gap:8px; margin-bottom:28px; }
        .step-dot { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.2); transition:0.3s; }
        .step-dot.active { background:#b9ff00; }
        .step-dot.done { background:rgba(185,255,0,0.4); }
    </style>
</head>
<body>
<div class="glass-container">
    <div class="step-indicator">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
        <div class="step-dot" id="dot3"></div>
    </div>

    <!-- STEP 1 -->
    <div class="step active" id="step1">
        <h2 class="form-title">Forgot Password</h2>
        <p class="subtitle">Enter your registered email and we'll send you an OTP.</p>
        <div class="field-group">
            <label>Email Address</label>
            <input type="email" id="resetEmail" placeholder="your@email.com">
        </div>
        <p class="msg-error" id="step1Error"></p>
        <button class="submit-btn" id="btnSendOtp" onclick="sendResetOtp()">SEND OTP</button>
        <a href="/" class="back-link">← Back to Login</a>
    </div>

    <!-- STEP 2 -->
    <div class="step" id="step2">
        <h2 class="form-title">Enter OTP</h2>
        <p class="subtitle">Check your email for the 6-digit code. Expires in 10 minutes.</p>
        <div class="field-group">
            <label>OTP Code</label>
            <input type="text" id="otpInput" class="otp-input" maxlength="6" placeholder="------">
        </div>
        <p class="msg-error" id="step2Error"></p>
        <button class="submit-btn" id="btnVerifyOtp" onclick="verifyResetOtp()">VERIFY OTP</button>
        <a class="back-link" onclick="goToStep(1)">← Back</a>
    </div>

    <!-- STEP 3 -->
    <div class="step" id="step3">
        <h2 class="form-title">New Password</h2>
        <p class="subtitle">Choose a strong password (min. 6 characters).</p>
        <div class="field-group">
            <label>New Password</label>
            <div class="password-wrapper">
                <input type="password" id="newPass" placeholder="Enter new password">
                <span class="toggle-eye" onclick="togglePw('newPass')">👁️</span>
            </div>
        </div>
        <div class="field-group">
            <label>Confirm Password</label>
            <div class="password-wrapper">
                <input type="password" id="confirmPass" placeholder="Confirm new password">
                <span class="toggle-eye" onclick="togglePw('confirmPass')">👁️</span>
            </div>
        </div>
        <p class="msg-error" id="step3Error"></p>
        <p class="msg-success" id="step3Success"></p>
        <button class="submit-btn" id="btnResetFinal" onclick="resetFinal()">RESET PASSWORD</button>
    </div>
</div>

<script>
    const CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]').content;

    function securePost(url, body) {
        return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF_TOKEN },
            body: JSON.stringify({ ...body, csrf_token: CSRF_TOKEN })
        }).then(r => r.json());
    }

    function goToStep(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('step' + n).classList.add('active');
        for (let i = 1; i <= 3; i++) {
            const dot = document.getElementById('dot' + i);
            dot.classList.remove('active','done');
            if (i < n) dot.classList.add('done');
            else if (i === n) dot.classList.add('active');
        }
    }

    function showError(id, msg) { const el=document.getElementById(id); el.innerText=msg; el.style.display='block'; }
    function clearError(id) { document.getElementById(id).style.display='none'; }

    function sendResetOtp() {
        clearError('step1Error');
        const email = document.getElementById('resetEmail').value.trim();
        if (!email) { showError('step1Error','Please enter your email.'); return; }
        const btn = document.getElementById('btnSendOtp');
        btn.disabled=true; btn.innerText='Sending...';
        securePost('/forgot_password_api', { email })
        .then(data => {
            btn.disabled=false; btn.innerText='SEND OTP';
            if (data.success) goToStep(2);
            else showError('step1Error', data.message);
        })
        .catch(() => { btn.disabled=false; btn.innerText='SEND OTP'; showError('step1Error','Network error. Try again.'); });
    }

    function verifyResetOtp() {
        clearError('step2Error');
        const otp = document.getElementById('otpInput').value.trim();
        if (!otp || otp.length !== 6) { showError('step2Error','Enter the 6-digit OTP.'); return; }
        const btn = document.getElementById('btnVerifyOtp');
        btn.disabled=true; btn.innerText='Verifying...';
        securePost('/verify_reset_otp', { otp })
        .then(data => {
            btn.disabled=false; btn.innerText='VERIFY OTP';
            if (data.success) goToStep(3);
            else showError('step2Error', data.message);
        })
        .catch(() => { btn.disabled=false; btn.innerText='VERIFY OTP'; showError('step2Error','Network error. Try again.'); });
    }

    function resetFinal() {
        clearError('step3Error');
        const pass    = document.getElementById('newPass').value;
        const confirm = document.getElementById('confirmPass').value;
        if (!pass || pass.length < 6) { showError('step3Error','Password must be at least 6 characters.'); return; }
        if (pass !== confirm)          { showError('step3Error','Passwords do not match.'); return; }
        const btn = document.getElementById('btnResetFinal');
        btn.disabled=true; btn.innerText='Resetting...';
        securePost('/reset_password_final', { password: pass })
        .then(data => {
            btn.disabled=false; btn.innerText='RESET PASSWORD';
            if (data.success) {
                const s = document.getElementById('step3Success');
                s.innerText='✅ Password reset! Redirecting to login...';
                s.style.display='block';
                setTimeout(() => window.location.href='/', 2000);
            } else {
                showError('step3Error', data.message);
            }
        })
        .catch(() => { btn.disabled=false; btn.innerText='RESET PASSWORD'; showError('step3Error','Network error. Try again.'); });
    }

    function togglePw(id) {
        const el = document.getElementById(id);
        el.type = el.type==='password' ? 'text' : 'password';
    }
</script>
</body>
</html>
